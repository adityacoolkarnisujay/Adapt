<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HomeShield</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@200;300;400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one cinematic "showroom" screen. Wordmark + pill nav + notifications across the top, the home turning on a studio floor in the middle, three glass cards along the bottom. Single steel-navy look by design. */
:root{
  color-scheme: dark;
  --bg:#1b2633; --bg-top:#7d8d9d; --bg-mid:#4b5b6d;
  --glass:rgba(26,36,49,.58); --glass-2:rgba(255,255,255,.07); --glass-3:rgba(255,255,255,.13);
  --solid:#18222f; --solid-2:#202c3b; --solid-3:#2a3748;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.18);
  --fg:#F1F4F8; --muted:#A9B6C5; --faint:#7d8b9c;
  --teal:#4FD6C4; --teal-ink:#05231f; --teal-dim:rgba(79,214,196,.15);
  --amber:#F5BB55; --amber-dim:rgba(245,187,85,.16);
  --red:#F47168; --red-dim:rgba(244,113,104,.16);
  --grey:#8a97a8; --grey-dim:rgba(138,151,168,.16);
  --font-display:'Sora','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r-xl:26px; --r-lg:20px; --r-md:14px;
  --shadow:0 24px 60px -24px rgba(0,0,0,.65);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background:var(--bg);
  background-image:radial-gradient(120% 85% at 50% 18%, #53647b 0%, #27354a 38%, #131c2a 68%, #0a0f18 100%);
  background-attachment:fixed;
  color:var(--fg); font-family:var(--font-body); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:10px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:15px;height:15px}.ic.lg{width:21px;height:21px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--font-mono);font-size:.86em}
.tnum{font-variant-numeric:tabular-nums}
.gutter{padding-left:max(24px, env(safe-area-inset-left,0px));padding-right:max(24px, env(safe-area-inset-right,0px))}

/* ---------- header ---------- */
.hdr{position:absolute;top:0;left:0;right:0;z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:16px;padding-block:20px 0}
.logo{font-family:var(--font-display);font-weight:400;font-size:21px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.logo .ic{color:var(--teal)}
.gw{display:flex;gap:10px;align-items:center;margin-top:6px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.gw .dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;margin-right:6px;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 25%,transparent)}
.gw .on{color:var(--teal)}.gw .off{color:var(--red)}
.gw b{color:var(--fg);font-weight:500}
.sim{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--amber);border:1px dashed color-mix(in srgb,var(--amber) 60%,transparent);padding:2px 7px;border-radius:999px}
.pills{display:flex;gap:6px;padding:5px;border-radius:16px;background:rgba(20,29,40,.35);backdrop-filter:blur(14px);border:1px solid var(--line)}
.pills button{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;height:40px;min-width:44px;padding:0 12px;border:0;border-radius:12px;background:rgba(255,255,255,.04);color:var(--muted);font-size:13.5px;font-weight:600;transition:background .2s,min-width .3s}
.pills button:hover{color:var(--fg);background:rgba(255,255,255,.09)}
.pills button .t{display:none}
.pills button[aria-current="page"]{min-width:118px;background:rgba(255,255,255,.2);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.pills button[aria-current="page"] .t{display:inline}
.pills .badge{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;font-size:10.5px;line-height:16px;font-weight:700}
.badge.red{background:var(--red);color:#2a0805}.badge.amber{background:var(--amber);color:#2a1a00}
.hdr-r{display:flex;justify-content:flex-end;align-items:flex-start;gap:8px;position:relative}
.sq{display:grid;place-items:center;position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(20,29,40,.35);backdrop-filter:blur(14px)}
.sq:hover{border-color:var(--line-2)}
.sq .badge{position:absolute;top:-4px;right:-4px}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:linear-gradient(140deg,#e7b48e,#9a6b55);color:#2a1a10;border:2px solid rgba(255,255,255,.5)}
.notes{position:absolute;top:50px;right:0;width:250px;display:flex;flex-direction:column;gap:6px}
.note{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:9px 11px;border-radius:12px;border:1px solid var(--line);background:rgba(22,31,43,.6);backdrop-filter:blur(14px);font-size:12.5px;line-height:1.35}
.note:hover{border-color:var(--line-2)}
.note .ni{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;flex:none;background:var(--glass-2)}
.note b{display:block;font-weight:600;font-size:12.5px}
.note small{color:var(--muted)}
.pop{position:absolute;right:0;top:50px;z-index:40;width:330px;max-height:70vh;overflow:auto;padding:12px;background:var(--solid);border:1px solid var(--line-2);border-radius:var(--r-md);box-shadow:var(--shadow)}
.pop h3{margin:2px 4px 10px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between}
.menu button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:9px 10px;border:0;background:none;border-radius:10px}
.menu button:hover,.menu button:focus-visible{background:var(--solid-2)}
.menu .radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);margin-top:2px;flex:none}
.menu button[aria-checked="true"] .radio{border-color:var(--teal);box-shadow:inset 0 0 0 3px var(--solid);background:var(--teal)}
.menu small{display:block;color:var(--muted);font-size:12.5px}

/* ---------- overview "showroom" ---------- */
#view-overview{position:relative;height:max(100vh, 800px);overflow:hidden}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:pan-y}
#stage canvas:active{cursor:grabbing}
.labels{position:absolute;inset:0;pointer-events:none;z-index:5}
.nl{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:7px;padding:5px 10px 5px 8px;border-radius:999px;background:rgba(16,24,35,.7);backdrop-filter:blur(8px);border:1px solid var(--line-2);font-size:12px;font-weight:600;white-space:nowrap;will-change:transform;transition:opacity .25s}
.nl:hover{border-color:#fff}
.nl .d{width:7px;height:7px;border-radius:50%}
.nl .s{font-weight:500;color:var(--muted)}
.nl.dim{opacity:.3}.nl.hide{opacity:0;pointer-events:none}
.d.teal{background:var(--teal)}.d.red{background:var(--red)}.d.amber{background:var(--amber)}.d.grey{background:var(--grey)}
.title{position:absolute;left:50%;top:max(96px, 12vh);transform:translateX(-50%);text-align:center;pointer-events:none;z-index:6;width:min(640px,92%)}
.title .eye{display:flex;justify-content:center;align-items:center;gap:12px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.title .eye i{width:1px;height:13px;background:rgba(255,255,255,.4)}
.title .eye .ic{width:16px;height:16px}
.title h1{margin:4px 0 2px;font-family:var(--font-display);font-weight:300;font-size:clamp(30px,3.6vw,46px);letter-spacing:-.02em;text-shadow:0 2px 30px rgba(0,0,0,.25)}
.title h1 span{font-weight:200;opacity:.85}
.title p{margin:0;color:rgba(255,255,255,.72);font-size:13.5px}
.modes{position:absolute;left:max(24px, env(safe-area-inset-left,0px));top:42%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;z-index:6}
.modes button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:6px 4px;color:rgba(255,255,255,.55);font-size:12.5px;text-align:left}
.modes .k{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.1);font-size:11px;font-weight:700;color:rgba(255,255,255,.8)}
.modes button[aria-pressed="true"]{color:#fff}
.modes button[aria-pressed="true"] .k{background:#fff;color:#1b2633}
.modes button[aria-pressed="true"] .n{font-family:var(--font-display);font-size:22px;font-weight:300}
.modes button:hover{color:#fff}
.modes .hint{font-size:11.5px;color:rgba(255,255,255,.5);max-width:150px;margin:6px 0 0 40px;line-height:1.35}
.zoomc{position:absolute;right:max(24px, env(safe-area-inset-right,0px));top:42%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:6}
.rnd{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(20,29,40,.25);backdrop-filter:blur(8px);color:#fff}
.rnd:hover{border-color:#fff;background:rgba(255,255,255,.1)}
body.day{background-image:radial-gradient(120% 85% at 50% 18%, var(--bg-top) 0%, var(--bg-mid) 38%, #2a3746 68%, var(--bg) 100%)}
#night-btn{margin-top:6px}
.orbit{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--cards-h, 220px) + 22px);display:flex;align-items:center;gap:18px;z-index:6;font-family:var(--font-display);font-weight:300;font-size:17px}
.orbit .lg{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:6px;display:flex;gap:14px;white-space:nowrap;font-family:var(--font-body);font-size:11px;color:rgba(255,255,255,.6)}
.orbit .lg span{display:flex;gap:6px;align-items:center}
.orbit .lg i{display:block;width:18px;border-top:2px solid}
.cards{position:absolute;left:0;right:0;bottom:0;z-index:7;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding-bottom:max(18px, env(safe-area-inset-bottom,0px))}
.card{position:relative;background:var(--glass);backdrop-filter:blur(20px) saturate(1.2);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px 18px;min-width:0;display:flex;flex-direction:column;gap:12px}
.card-top{display:flex;align-items:center;gap:12px}
.chipi{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--glass-2);border:1px solid var(--line);flex:none}
.card-top .tt{min-width:0;flex:1}
.card-top b{display:block;font-size:14px;font-weight:600}
.card-top small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--line-2);background:none;flex:none}
.arrow:hover{border-color:#fff}
.big{font-family:var(--font-display);font-weight:300;font-size:34px;line-height:1;letter-spacing:-.02em}
.big small{font-size:15px;color:var(--muted);margin-left:4px}
.foot{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:10.5px;color:rgba(255,255,255,.35);z-index:7;pointer-events:none}
.att-h{font-size:16.5px;font-weight:500;line-height:1.35;margin:0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.meta span{display:flex;gap:5px;align-items:center}
.seg6{display:flex;gap:4px}
.seg6 i{flex:1;height:5px;border-radius:3px;background:var(--glass-3)}
.seg6 i.teal{background:var(--teal)}.seg6 i.amber{background:var(--amber)}.seg6 i.red{background:var(--red)}.seg6 i.grey{background:var(--grey)}
.devdots{display:flex;gap:6px;flex-wrap:wrap}
.devdot{position:relative;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--glass-2)}
.devdot:hover{border-color:var(--line-2)}
.devdot .d{position:absolute;right:-2px;top:-2px;width:9px;height:9px;border-radius:50%;border:2px solid #1d2836}
.bars{display:flex;align-items:flex-end;gap:5px;height:56px}
.bars i{flex:1;border-radius:3px 3px 1px 1px;background:rgba(255,255,255,.75);min-height:3px;transition:height .4s}
.bars.off i{background:rgba(255,255,255,.18)}
.bars.deg i{background:var(--amber)}
.bars-x{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint)}

/* ---------- generic ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.teal{background:var(--teal-dim);color:var(--teal)}.chip.amber{background:var(--amber-dim);color:var(--amber)}.chip.red{background:var(--red-dim);color:var(--red)}.chip.grey{background:var(--grey-dim);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 15px;border-radius:12px;border:1px solid var(--line-2);background:var(--glass-2);font-weight:600;font-size:14px}
.btn:hover{border-color:rgba(255,255,255,.4)}
.btn.primary{background:#fff;color:#16202c;border-color:transparent}
.btn.primary:hover{background:#e6ecf2}
.btn.danger{background:var(--red);color:#2b0704;border-color:transparent}
.btn.ghost{background:none}
.btn.small{min-height:32px;padding:5px 11px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--teal);font-weight:600;font-size:13px;display:inline-flex;gap:4px;align-items:center}
.link:hover{text-decoration:underline}
.link[disabled]{opacity:.45;cursor:not-allowed;text-decoration:none}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.st.red{color:var(--red)}.st.teal{color:var(--teal)}.st.amber{color:var(--amber)}.st.grey{color:var(--muted)}
.switch{position:relative;width:44px;height:26px;border-radius:13px;border:1px solid var(--line-2);background:rgba(255,255,255,.1);flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#cfd8e2;transition:transform .2s}
.switch[aria-checked="true"]{background:var(--teal);border-color:transparent}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:var(--teal-ink)}
.switch[disabled]{opacity:.45;cursor:not-allowed}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--teal);animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.skel{border-radius:7px;background:linear-gradient(90deg,var(--glass-2),var(--glass-3),var(--glass-2));background-size:200% 100%;animation:sh 1.3s linear infinite;height:13px}
@keyframes sh{to{background-position:-200% 0}}
.demo-label{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--amber)}
.empty{display:grid;place-items:center;text-align:center;gap:8px;padding:28px 12px;color:var(--muted)}
.empty .ic{width:28px;height:28px;color:var(--faint)}
.empty strong{color:var(--fg);font-weight:600}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.feed li{display:grid;grid-template-columns:44px 10px minmax(0,1fr);gap:8px;font-size:13.5px;align-items:start}
.feed time{color:var(--faint);font-variant-numeric:tabular-nums;font-size:12.5px;padding-top:1px}
.feed .m{width:8px;height:8px;border-radius:50%;margin-top:6px}
.m.red{background:var(--red)}.m.teal{background:var(--teal)}.m.amber{background:var(--amber)}.m.grey{background:var(--grey)}

/* ---------- inner pages ---------- */
.page{padding-top:118px;padding-bottom:40px;min-height:100vh}
.page-h{font-family:var(--font-display);font-weight:300;font-size:34px;margin:0 0 18px;letter-spacing:-.02em}
.panel{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;min-width:0}
.panel-head{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
.panel-head h2{margin:0;font-size:15px;font-weight:600}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 8px;border:0;background:none;border-radius:12px;text-align:left}
button.row:hover{background:rgba(255,255,255,.05)}
button.row[aria-current="true"]{background:rgba(255,255,255,.08)}
.row .av{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--glass-2);border:1px solid var(--line);flex:none}
.row .tx{min-width:0;flex:1}
.row .tx b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx small{display:block;color:var(--muted);font-size:12.5px}
.dev-grid{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:18px;align-items:start}
.search{display:flex;align-items:center;gap:8px;padding:0 12px;height:44px;border-radius:12px;border:1px solid var(--line-2);background:rgba(0,0,0,.18)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:14.5px}
.search:focus-within{border-color:var(--teal)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.fchip{padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);background:none;font-size:13px;font-weight:600;color:var(--muted)}
.fchip[aria-pressed="true"]{background:#fff;color:#16202c;border-color:transparent}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:rgba(0,0,0,.18);border:1px solid var(--line)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.16);color:#fff}
.map-wrap{overflow-x:auto}
.map{display:block;width:100%;min-width:620px;height:auto}
.map .node,.map .edge{cursor:pointer}
.map .node:focus,.map .edge:focus{outline:none}
.map .node:focus-visible .ring,.map .node.sel .ring{stroke:#fff;stroke-width:2.6}
.map .edge:focus-visible .vis,.map .edge.sel .vis{stroke-width:4}
.map text{font-family:var(--font-body)}
.map .dim{opacity:.22}
.map-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.map-legend span{display:flex;align-items:center;gap:8px}
.map-legend i{display:block;width:28px;border-top:2px solid}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(255,255,255,.04)}
.tbl-wrap{overflow-x:auto}
.inc-list{display:flex;flex-direction:column;gap:10px}
.inc{display:grid;grid-template-columns:4px 40px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 16px 14px 0;border-radius:var(--r-md);border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(20px);overflow:hidden}
.inc:hover{border-color:var(--line-2)}
.inc .stripe{align-self:stretch;margin:-14px 0}
.stripe.red{background:var(--red)}.stripe.teal{background:var(--teal)}.stripe.grey{background:var(--grey)}
.inc b{display:block;font-weight:600}
.inc small{color:var(--muted)}
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row .l{font-weight:500}
.set-row small{display:block;color:var(--muted);font-size:13px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}
.opt:has(input:checked){border-color:var(--teal);background:var(--teal-dim)}
.opt input{accent-color:var(--teal);margin-top:4px}
.opt small{display:block;color:var(--muted)}
.result{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:12px;font-size:14px}
.result.ok{background:var(--teal-dim)}.result.err{background:var(--red-dim)}
.errbox{border:1px solid color-mix(in srgb,var(--red) 45%,var(--line));background:var(--red-dim);border-radius:var(--r-md);padding:12px 14px;font-size:14px;display:flex;gap:10px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:0;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,10,18,.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:51;width:min(480px,100%);display:flex;flex-direction:column;background:var(--solid);border-left:1px solid var(--line-2);box-shadow:-30px 0 60px -30px rgba(0,0,0,.7);transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.on{transform:none}
.dr-head{display:flex;gap:12px;align-items:flex-start;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.dr-head h2{margin:2px 0 0;font-family:var(--font-display);font-weight:300;font-size:21px;line-height:1.3;text-wrap:balance}
.dr-head h2:focus{outline:none}
.dr-head .x{margin-left:auto;flex:none}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dr-body{overflow-y:auto;padding:18px 22px 28px;display:flex;flex-direction:column;gap:22px;overscroll-behavior:contain}
.dr-body h3{margin:0 0 10px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.dr-body p{margin:0}
.verdict{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.verdict div{padding:12px;border-radius:12px;border:1px solid var(--line)}
.verdict b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.timeline li:first-child{border-top:0}
.timeline time{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);padding-top:2px}
.reco{border:1px solid color-mix(in srgb,var(--teal) 40%,var(--line));border-radius:var(--r-md);padding:16px;background:linear-gradient(180deg,var(--teal-dim),transparent)}
.reco h4{margin:0 0 6px;font-size:16px}
.reco .btn.primary{background:var(--teal);color:var(--teal-ink)}
.effects{list-style:none;margin:12px 0 16px;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.effects li{display:flex;gap:10px;align-items:flex-start}
.effects .ic{margin-top:2px}
.confirm{border:1px solid color-mix(in srgb,var(--red) 45%,var(--line));background:var(--red-dim);border-radius:var(--r-md);padding:16px;margin-top:12px}
.confirm h4{margin:0 0 6px}
.warnbox{border:1px solid color-mix(in srgb,var(--amber) 45%,var(--line));background:var(--amber-dim);border-radius:var(--r-md);padding:14px;font-size:14px}
.checks{list-style:none;margin:10px 0;padding:0}
.checks li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.checks li:first-child{border-top:0}
.checks small{display:block;color:var(--muted);font-size:13px}
.applied{border:1px solid var(--line-2);border-radius:var(--r-md);padding:16px;background:var(--solid-2)}
.applied:focus{outline:none}
details{border:1px solid var(--line);border-radius:12px;padding:0 14px}
details summary{cursor:pointer;padding:12px 0;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details[open] summary .ic{transform:rotate(180deg)}
details .inner{padding-bottom:14px}
.perm{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.perm input{accent-color:var(--teal);width:18px;height:18px;margin-top:2px;flex:none}
.perm b{font-weight:600;display:block}
.perm small{display:block;color:var(--muted);font-size:13px}
.perm .tag{margin-left:auto}
.perm-list{display:flex;flex-direction:column;gap:8px}
.connlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.connlist button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:none;font-size:14px}
.connlist button:hover{border-color:var(--line-2)}
.connlist .tx{flex:1;min-width:0}
.connlist small{display:block;color:var(--muted);font-size:12.5px}
.range{width:100%;accent-color:var(--teal)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{padding:12px;border-radius:12px;background:var(--solid-2);border:1px solid var(--line)}
.metric b{display:block;font-family:var(--font-display);font-weight:300;font-size:24px}
.metric small{color:var(--muted);font-size:12.5px}
.flow{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14px;border-top:1px solid var(--line)}
.flow:first-child{border-top:0}
.flow input{accent-color:var(--teal);width:17px;height:17px}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(520px,calc(100% - 32px))}
.toast{display:flex;gap:12px;align-items:center;width:100%;padding:12px 14px;border-radius:14px;background:var(--solid-3);border:1px solid var(--line-2);box-shadow:var(--shadow);font-size:14px;animation:tin .25s ease}
.toast .ic{color:var(--teal)}.toast .grow{flex:1}
@keyframes tin{from{transform:translateY(10px);opacity:0}}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .cards{grid-template-columns:1fr 1fr}
  .cards .card:first-child{grid-column:1/-1}
  #view-overview{height:max(100vh, 940px)}
  .notes{display:none}
}
@media (max-width:900px){.dev-grid,.set-grid{grid-template-columns:1fr}}
@media (max-width:760px){
  .hdr{grid-template-columns:1fr auto}
  .pills{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:45;border-radius:20px 20px 0 0;justify-content:space-around;padding:8px max(12px, env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px, env(safe-area-inset-left,0px));background:rgba(18,26,37,.92)}
  .pills button{flex:1;flex-direction:column;height:auto;padding:6px 2px;gap:2px;font-size:11px;min-width:0!important}
  .pills button .t{display:inline}
  #view-overview{height:auto;overflow:visible;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  #stage{position:relative;height:560px}
  .title{top:150px}
  .title h1{font-size:30px}
  .modes{top:auto;bottom:auto;left:0;right:0;transform:none;position:relative;flex-direction:row;overflow-x:auto;margin-top:-56px;padding:0 16px}
  .modes button{flex:none}
  .modes button[aria-pressed="true"] .n{font-size:16px}
  .modes .hint{display:none}
  .zoomc{top:260px;transform:none;right:12px}
  .orbit{position:relative;left:auto;transform:none;bottom:auto;justify-content:center;margin:14px 0 30px}
  .cards{position:relative;grid-template-columns:1fr;margin-top:8px}
  .foot{position:relative;margin-top:14px}
  .page{padding-top:100px;padding-bottom:110px}
  .verdict,.metrics{grid-template-columns:1fr}
  .drawer{top:auto;height:92vh;width:100%;border-left:0;border-top:1px solid var(--line-2);border-radius:22px 22px 0 0;transform:translateY(102%)}
  .drawer.on{transform:none}
  .toasts{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.rm *,.rm *::before,.rm *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
</style>

<div class="app" id="app">
  <header class="hdr gutter">
    <div>
      <div class="logo"><svg class="ic lg" aria-hidden="true"><use href="#i-shield"/></svg>HomeShield</div>
      <div class="gw" id="gw"></div>
    </div>
    <nav class="pills" id="nav" aria-label="Main">
      <button data-act="nav" data-id="overview" aria-label="Overview" title="Overview"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg><span class="t">Overview</span></button>
      <button data-act="nav" data-id="devices" aria-label="Devices &amp; Connections" title="Devices &amp; Connections"><svg class="ic" aria-hidden="true"><use href="#i-net"/></svg><span class="t">Devices</span><span class="badge amber" id="nb-dev" hidden></span></button>
      <button data-act="nav" data-id="incidents" aria-label="Incidents" title="Incidents"><svg class="ic" aria-hidden="true"><use href="#i-alert"/></svg><span class="t">Incidents</span><span class="badge red" id="nb-inc" hidden></span></button>
      <button data-act="nav" data-id="settings" aria-label="Settings" title="Settings"><svg class="ic" aria-hidden="true"><use href="#i-sliders"/></svg><span class="t">Settings</span></button>
    </nav>
    <div class="hdr-r">
      <button class="sq" id="demo-btn" data-act="demo-menu" aria-haspopup="true" aria-expanded="false" aria-label="Demo scenarios" title="Demo scenarios"><svg class="ic" aria-hidden="true"><use href="#i-flask"/></svg></button>
      <button class="sq" id="bell-btn" data-act="bell" aria-haspopup="true" aria-expanded="false" aria-label="Recent activity" title="Recent activity"><svg class="ic" aria-hidden="true"><use href="#i-bell"/></svg><span class="badge red" id="nb-bell" hidden></span></button>
      <span class="avatar" aria-hidden="true">D</span>
      <div class="notes" id="notes"></div>
      <div class="pop menu" id="demo-menu" role="menu" hidden>
        <h3>Demo scenarios</h3>

        <button role="menuitemradio" data-act="scenario" data-id="offline"><span class="radio"></span><span>Gateway offline<small>Monitoring and enforcement unavailable</small></span></button>
        <button role="menuitemradio" data-act="scenario" data-id="degraded"><span class="radio"></span><span>Privacy degraded<small>Relay slow, traffic shaping partly paused</small></span></button>

      <p id="t-sub"></p>

      <button class="rnd" data-act="zoom" data-id="reset" aria-label="Reset view"><svg class="ic" aria-hidden="true"><use href="#i-rotate"/></svg></button>

<script>
(function(){

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];

const ic=(n,c='')=>`<svg class="ic ${c}" aria-hidden="true" focusable="false"><use href="#i-${n}"></use></svg>`;
const KIND={camera:'camera',motion:'motion',bulb:'bulb',hub:'hub',laptop:'laptop',plug:'plug',cloud:'cloud'};

      {id:'motion',name:'Hallway Motion Sensor',kind:'motion',room:'Hallway',model:'Zigbee motion sensor',ip:'Zigbee, through Home Hub',mac:'00:15:8D:00:09:3A:22:71',fw:'1.0.24',status:'managed',identity:'Verified',idNote:'Paired through Home Hub',since:'12 Mar 2026'},

      {id:'laptop',name:'Personal Laptop',kind:'laptop',room:'Study',model:'Laptop',ip:'192.168.1.23',mac:'F4:D4:88:2A:7C:10',fw:'Not applicable',status:'managed',identity:'Verified',idNote:'Signed in to your HomeShield account',since:'12 Mar 2026'},
      {id:'plug',name:'New Smart Plug',kind:'plug',room:'Study',model:'Wi-Fi smart plug',ip:'192.168.1.57',mac:'D8:1F:12:6B:A4:03',fw:'1.3.2',status:'pending',identity:'Fingerprint match',idNote:'Network behavior matches a Wi-Fi smart plug. No manufacturer certificate.',since:'Today, 21:31'}

      {id:'c8',from:'cam',to:'laptop',status:'blocked',source:'hold',purpose:'File sharing (SMB)',short:'File sharing',proto:'SMB · TCP 445',seen:'14 attempts, 21:47:03 to 21:47:09'},

let S=initial();

const FLOWS=[
  {key:'cam',label:'Camera event uploads',mb:60},
  {key:'motion',label:'Motion sensor reports (via hub)',mb:20},
  {key:'light',label:'Light state changes (via hub)',mb:10},
  {key:'hub',label:'Home Hub status sync',mb:30}

const MODES=[['exterior','E','Exterior'],['interior','I','Interior'],['network','N','Network'],['threats','T','Threats']];
const MODE_HINT={exterior:'Devices glow through the walls. Drag to turn the house.',interior:'Roof lifted so you can see each room.',network:'Every connection and where it goes.',threats:'Only blocked and pending connections.'};

/* ---------- helpers ---------- */
const dev=id=>S.devices.find(d=>d.id===id);
const conn=id=>S.conns.find(c=>c.id===id);
const inc=id=>S.incidents.find(i=>i.id===id);
const nameOf=id=>id==='net'?'Internet':dev(id).name;
const connsOf=id=>S.conns.filter(c=>c.from===id||c.to===id);
const offline=()=>S.scenario==='offline';
const reduced=()=>sysReduce||S.settings.reduce;
function tick(){S.clock+=1;const h=Math.floor(S.clock/60)%24,m=S.clock%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
function log(tone,text,devs,open){S.activity.unshift({t:tick(),tone,text,dev:devs||[],open})}
function counts(){return {disc:S.devices.length,managed:S.devices.filter(d=>d.status==='managed').length,pending:S.devices.filter(d=>d.status==='pending').length,active:S.incidents.filter(i=>i.status==='active').length}}
const connTone=c=>c.status==='allowed'?'teal':c.status==='blocked'?'red':'amber';
const connIcon=c=>c.status==='allowed'?'check':c.status==='blocked'?'block':'clock';
const connWord=c=>c.status==='allowed'?'Allowed':c.status==='blocked'?'Blocked':'Waiting for approval';
function ruleText(c){return ({approved:'Approved by you',hold:'Blocked by your policy. Waiting for your decision.',rule:'Blocked permanently by rule HS-R17',isolate:'Blocked while the device is isolated',user:'Blocked by you',onboarding:'Not granted during setup',request:'Requested by the device. Not approved yet.'})[c.source]||''}
function devState(d){
  if(offline()) return {tone:'grey',text:'No data'};
  if(d.isolated) return {tone:'red',text:'Isolated'};
  if(d.status==='pending') return {tone:'amber',text:'Awaiting approval'};
  if(S.incidents.find(i=>i.device===d.id&&i.status==='active')) return {tone:'red',text:'Incident'};
  return {tone:'teal',text:'Managed'};
}
function privacyState(){
  const P=S.privacy;const need=FLOWS.filter(f=>P.flows[f.key]).reduce((a,f)=>a+f.mb,0);
  if(!P.enabled) return {key:'inactive',label:'Off',tone:'grey',need};
  if(offline()) return {key:'unavailable',label:'Unavailable while the gateway is offline',tone:'grey',need};
  if(need===0) return {key:'inactive',label:'No traffic selected',tone:'grey',need};
  if(S.scenario==='degraded') return {key:'degraded',label:'Traffic shaping degraded',tone:'amber',need,why:'The relay is responding slowly. Shaping for camera event uploads is paused until it recovers.'};
  if(P.budget<need) return {key:'degraded',label:'Traffic shaping degraded',tone:'amber',need,why:`Your budget covers ${Math.round(P.budget/need*100)}% of the selected traffic. Raise it to ${need} MB/day to cover everything.`};
  return {key:'active',label:'Traffic shaping active',tone:'teal',need};
}

/* ---------- chrome ---------- */
function renderChrome(){
  const c=counts();
  $('#gw').innerHTML=offline()?`<span class="off"><span class="dot"></span><b>Gateway offline</b></span><span>Monitoring unavailable</span><span class="sim">Simulated</span>`
    :`<span class="on"><span class="dot"></span><b>Gateway online</b></span><span class="tnum">Monitoring ${c.managed} of ${c.disc} devices</span><span class="sim">Simulated</span>`;
  const nd=$('#nb-dev'),ni=$('#nb-inc'),nb=$('#nb-bell');
  nd.hidden=!c.pending;nd.textContent=c.pending;
  ni.hidden=!c.active;ni.textContent=c.active;
  const att=c.active+c.pending;nb.hidden=!att;nb.textContent=att;
  $$('#nav button').forEach(b=>{if(b.dataset.id===S.view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  $$('#demo-menu button').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.id===S.scenario)));
  ['overview','devices','incidents','settings'].forEach(v=>$('#view-'+v).hidden=v!==S.view);
  // notes (top-right, like the reference)
  const notes=S.view==='overview'&&!S.loading?S.activity.slice(0,2):[];
  $('#notes').innerHTML=notes.map((a,i)=>`<button class="note" ${a.open?`data-act="open-${a.open[0]}" data-id="${a.open[1]}"`:'data-act="bell"'}><span class="ni" style="color:var(--${a.tone==='grey'?'muted':a.tone})">${ic(a.tone==='red'?'alert':a.tone==='amber'?'clock':'check','sm')}</span><span><b>${esc(a.text.split('. ')[0].replace(/\.$/,''))}</b><small>Today, ${a.t}</small></span></button>`).join('');
  $('#feed').innerHTML=S.activity.slice(0,12).map(a=>`<li><time>${a.t}</time><span class="m ${a.tone}"></span><span>${esc(a.text)}</span></li>`).join('');
}

/* ---------- overview ---------- */
function renderOverview(){
  const c=counts();
  $('#t-state').innerHTML=offline()?'<span style="color:var(--red)">Offline</span>':'Online';
  $('#t-sub').textContent=`${c.disc} devices discovered · ${c.managed} managed · ${c.pending?c.pending+' awaiting approval':'none waiting'}`;
  $('#modes').innerHTML=MODES.map(([k,key,l])=>`<button data-act="mode" data-id="${k}" aria-pressed="${S.mode===k}"><span class="k">${key}</span><span class="n">${l}</span></button>`).join('')+`<p class="hint">${MODE_HINT[S.mode]}</p>`;

  // card 1: attention
  const A=$('#c-att');const I=inc('INC-1042');const plug=dev('plug');
  const top=(chip,tone,title,sub,act,id,label)=>`<div class="card-top"><span class="chipi" style="color:var(--${tone})">${ic(chip)}</span><span class="tt"><b>${title}</b><small>${sub}</small></span>${act?`<button class="arrow" data-act="${act}" ${id?`data-id="${id}"`:''} aria-label="${label}">${ic('arrow','sm')}</button>`:''}</div>`;
  if(S.loading){A.innerHTML=top('alert','muted','Needs attention','Connecting to gateway HS-1…')+`<div style="display:flex;gap:10px;align-items:center"><span class="spin"></span><span class="muted">Loading the latest activity</span></div><div class="skel" style="width:85%"></div><div class="skel" style="width:60%"></div>`}
  else if(offline()){
    A.innerHTML=top('offline','amber','Needs attention','Monitoring unavailable')+`<p class="att-h">HomeShield can't see new activity while gateway HS-1 is offline.</p><p class="meta" style="margin:0">This doesn't mean your home is safe or unsafe. Check that the gateway has power and is plugged into your router.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary small" data-act="nav" data-id="settings">Test gateway connection</button>${I.status==='active'?'<button class="btn small" data-act="open-incident" data-id="INC-1042">Last known incident</button>':''}</div>`;
  } else if(I.status==='active'){
    A.innerHTML=top('alert','red','Needs attention','INC-1042 · 1 active incident','open-incident','INC-1042','Open incident')+
      `<p class="att-h">${esc(I.title)}</p>
       <div class="meta"><span>${ic('laptop','sm')}Personal Laptop · 192.168.1.23</span><span>${ic('clock','sm')}Today, 21:47</span></div>
       <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between"><span class="chip red">${ic('block','sm')}Connection blocked by your policy</span><button class="btn primary small" data-act="open-incident" data-id="INC-1042">Review incident${ic('chev-r','sm')}</button></div>`;
  } else {
    const iso=S.change&&S.change.kind==='isolate';
    A.innerHTML=top('shield','teal','Needs attention',I.status==='contained'?'INC-1042 contained':'All clear',I.status==='contained'?'open-incident':null,'INC-1042','Open incident')+
      `<div class="big" style="font-size:28px">No incidents detected</div><p class="meta" style="margin:0">${I.status==='contained'?(iso?'Living Room Camera is isolated while you investigate.':'Camera-to-laptop connection stays blocked by rule HS-R17.'):'HomeShield will show anything that needs you here.'} Monitoring ${c.managed} of ${c.disc} devices.</p>`+
      (plug.status==='pending'?`<button class="link" data-act="open-device" data-id="plug">${ic('clock','sm')}New Smart Plug is waiting for approval</button>`:'');
  }
  if(!S.loading&&!offline()&&I.status==='active'&&plug.status==='pending'){A.insertAdjacentHTML('beforeend',`<button class="link" style="color:var(--amber)" data-act="open-device" data-id="plug">${ic('clock','sm')}Also: New Smart Plug is waiting for approval</button>`)}

  // card 2: devices
  const D=$('#c-dev');const pct=Math.round(c.managed/c.disc*100);
  const ringC=2*Math.PI*30;
  D.innerHTML=top('net','fg','Devices','Discovered on your network','nav','devices','Open Devices & Connections')+
    `<div style="display:flex;gap:14px;align-items:center;justify-content:space-between">
      <div style="min-width:0;flex:1"><div class="big tnum">${S.loading?'–':c.managed}<small>/ ${c.disc} managed</small></div>
        <div class="seg6" style="margin-top:12px" aria-hidden="true">${S.devices.map(d=>`<i class="${S.loading?'':devState(d).tone}"></i>`).join('')}</div></div>
      <svg width="76" height="76" viewBox="0 0 76 76" role="img" aria-label="${offline()?'Monitoring unavailable':`Monitoring ${c.managed} of ${c.disc} devices`}"><circle cx="38" cy="38" r="30" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="6"/><circle cx="38" cy="38" r="30" fill="none" stroke="${offline()?'var(--grey)':'var(--teal)'}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${offline()?0:ringC*pct/100} ${ringC}" transform="rotate(-90 38 38)"/><text x="38" y="37" text-anchor="middle" font-size="14" font-weight="600" fill="#fff" font-family="Figtree">${offline()?'—':pct+'%'}</text><text x="38" y="51" text-anchor="middle" font-size="9" fill="#A9B6C5" font-family="Figtree">monitored</text></svg>
    </div>
    <div class="devdots">${S.devices.map(d=>{const s=devState(d);return `<button class="devdot" data-act="open-device" data-id="${d.id}" aria-label="${esc(d.name)}, ${s.text}" title="${esc(d.name)} · ${s.text}">${ic(KIND[d.kind],'sm')}<span class="d ${S.loading?'grey':s.tone}"></span></button>`}).join('')}</div>`;

  // card 3: privacy
  const ps=privacyState();const P=S.privacy;const on=ps.key==='active'||ps.key==='degraded';
  const big=ps.key==='active'?'Active':ps.key==='degraded'?'Degraded':ps.key==='unavailable'?'Unavailable':'Off';
  const hrs=[.3,.2,.15,.15,.35,.7,.85,.6,.55,.75,.9,.6];
  $('#c-priv').innerHTML=top('wave','teal','Activity Privacy','Experimental traffic shaping','open-privacy',null,'Adjust Activity Privacy')+
    `<div style="display:flex;gap:16px;align-items:flex-end;justify-content:space-between">
      <div style="flex:none"><div class="big">${big}</div><div style="display:flex;gap:10px;align-items:center;margin-top:10px"><button class="switch" role="switch" aria-checked="${P.enabled}" aria-label="Activity Privacy" data-act="privacy-toggle" ${offline()?'disabled':''}></button><span class="muted" style="font-size:12.5px">${esc(ps.key==='inactive'&&P.enabled?ps.label:on?ps.label:'Traffic shaping off')}</span></div></div>
      <div style="flex:1;min-width:0;max-width:200px"><div class="bars ${on?(ps.key==='degraded'?'deg':''):'off'}" aria-hidden="true">${hrs.map(h=>`<i style="height:${on?Math.round(h*Math.min(1,P.budget/200)*100):6}%"></i>`).join('')}</div>
      <div class="bars-x"><span>00</span><span>12</span><span>24h</span></div></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="demo-label">Demo data</span><span class="muted tnum" style="font-size:12.5px">${on?`Up to ${P.budget} MB/day added`:'No added traffic'}</span></div>`;
  // card heights drive orbit placement
  requestAnimationFrame(()=>{const h=$('#cards').offsetHeight;document.documentElement.style.setProperty('--cards-h',h+'px')});
}

/* ---------- devices ---------- */
const POS2={net:[380,62],hub:[380,252],cam:[128,150],light:[128,372],motion:[380,420],laptop:[632,150],plug:[632,372]};
function matches(d){
  const q=S.search.trim().toLowerCase();
  const okQ=!q||[d.name,d.room,d.kind,d.model].join(' ').toLowerCase().includes(q);
  const okF=S.filter==='all'||(S.filter==='managed'&&d.status==='managed')||(S.filter==='review'&&(d.status==='pending'||devState(d).tone==='red'));
  return okQ&&okF;
}
function renderDevices(){
  const c=counts();
  const fl=[['all','All',c.disc],['managed','Managed',c.managed],['review','Needs review',S.devices.filter(d=>d.status==='pending'||devState(d).tone==='red').length]];
  $('#dev-filters').innerHTML=fl.map(([k,l,n])=>`<button class="fchip" data-act="filter" data-id="${k}" aria-pressed="${S.filter===k}">${l} <span class="tnum">${n}</span></button>`).join('');
  const list=S.devices.filter(matches);
  $('#dev-list').innerHTML=list.length?list.map(d=>{const s=devState(d);return `<li><button class="row" data-act="open-device" data-id="${d.id}" ${S.sel&&S.sel.id===d.id?'aria-current="true"':''}><span class="av">${ic(KIND[d.kind])}</span><span class="tx"><b>${esc(d.name)}</b><small>${esc(d.room)} · ${esc(d.model)}</small></span><span class="chip ${s.tone}">${esc(s.text)}</span></button></li>`}).join('')
    :`<li class="empty">${ic('search')}<strong>No devices match “${esc(S.search)}”.</strong><span>Try a room name like “Study”, or <button class="link" data-act="clear-search">clear the search</button>.</span></li>`;
  $$('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===S.mapMode)));
  $('#map-area').innerHTML=S.mapMode==='map'?mapSVG():connTable();
}
function mapSVG(){
  const vis=new Set(S.devices.filter(matches).map(d=>d.id));const anyQ=S.search.trim()||S.filter!=='all';
  const col={teal:'var(--teal)',red:'var(--red)',amber:'var(--amber)',grey:'var(--grey)'};
  let edges='',nodes='';
  S.conns.forEach(c=>{
    const a=POS2[c.from],b=POS2[c.to];const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);const ux=dx/L,uy=dy/L;
    const x1=a[0]+ux*36,y1=a[1]+uy*36,x2=b[0]-ux*40,y2=b[1]-uy*40;
    const tone=offline()?'grey':connTone(c);const dash=c.status==='blocked'?'7 6':c.status==='pending'?'1.5 7':'';
    const t=c.id==='c8'?.3:.5;const mx=a[0]+dx*t,my=a[1]+dy*t;
    const dim=anyQ&&!(vis.has(c.from)||vis.has(c.to))?'dim':'';const sel=S.sel&&S.sel.type==='conn'&&S.sel.id===c.id?'sel':'';
    const label=(c.status==='allowed'?'✓ ':c.status==='blocked'?'⊘ Blocked · ':'◷ Pending · ')+c.short;const w=label.length*6.3+18;
    edges+=`<g class="edge ${dim} ${sel}" role="button" tabindex="0" data-act="open-conn" data-id="${c.id}" aria-label="${esc(nameOf(c.from))} to ${esc(nameOf(c.to))}: ${connWord(c)}, ${esc(c.purpose)}">
      <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="transparent" stroke-width="18"/>
      <line class="vis" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col[tone]}" stroke-width="2.2" stroke-linecap="round" ${dash?`stroke-dasharray="${dash}"`:''} marker-end="url(#ar-${tone})"/>
      <rect x="${mx-w/2}" y="${my-11}" width="${w}" height="22" rx="11" fill="#18222f" stroke="${col[tone]}" stroke-opacity=".5"/>
      <text x="${mx}" y="${my+4}" text-anchor="middle" font-size="11.5" font-weight="600" fill="${col[tone]}">${esc(label)}</text></g>`;
  });
  Object.keys(POS2).forEach(id=>{
    const [x,y]=POS2[id];const isNet=id==='net';const d=isNet?null:dev(id);const s=isNet?{tone:offline()?'grey':'teal',text:'Outside your home'}:devState(d);
    const dim=anyQ&&!isNet&&!vis.has(id)?'dim':'';const sel=S.sel&&S.sel.type==='device'&&S.sel.id===id?'sel':'';
    nodes+=`<g class="node ${dim} ${sel}" ${isNet?'':`role="button" tabindex="0" data-act="open-device" data-id="${id}" aria-label="${esc(d.name)}, ${s.text}"`}>
      <circle class="ring" cx="${x}" cy="${y}" r="32" fill="#202c3b" stroke="${col[s.tone]}" stroke-width="1.6"/>
      <svg x="${x-12}" y="${y-12}" width="24" height="24" class="ic" style="color:#fff"><use href="#i-${isNet?'cloud':KIND[d.kind]}"/></svg>
      <text x="${x}" y="${y+50}" text-anchor="middle" font-size="13" font-weight="600" fill="#F1F4F8">${esc(isNet?'Internet':d.name)}</text>
      <text x="${x}" y="${y+66}" text-anchor="middle" font-size="11.5" fill="${col[s.tone]}">${esc(s.text)}</text></g>`;
  });

function isoConfirm(d,stops){return `<div class="confirm" id="iso-confirm"><h4>Isolate ${esc(d.name)}?</h4><p style="margin-bottom:8px">These will stop working until you reconnect it:</p><ul class="effects" style="margin:0 0 12px">${stops.length?stops.map(s=>`<li>${ic('block','sm')}<span>${esc(s)}</span></li>`).join(''):'<li>'+ic('info','sm')+'<span>No allowed connections are active.</span></li>'}</ul><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn danger" data-act="isolate" data-id="${d.id}">Isolate device</button><button class="btn ghost" data-act="cancel-isolate">Cancel</button></div></div>`}

const CHECKS={

function privMetrics(){

  S.change={kind:'rule',at:tick(),checks:'running'};

function isolate(id){

function reconnect(id){

    warm.emissiveIntensity=1.3+.7*night;glassM.emissiveIntensity=.1*night;scrM.emissiveIntensity=1+.5*night;tvM.emissiveIntensity=.9+.4*night;
    hallL.intensity=.8+.9*night;studyL.intensity=1+1*night;ups.forEach(s=>s.intensity=2.2*night);
    floorM.color.copy(lin('#566679')).lerp(lin('#2a3546'),night);
    if(bloom)bloom.strength=.3+.4*night;
    // camera
    if(intro&&el<introDur){const k=ease(el/introDur);radius=80+(tRadius-80)*k;phi=1.05+(tPhi-1.05)*k;theta=-.7+(tTheta+.7)*k}
    else{
      if(!introWave&&introDur){introWave=true;wave(C.teal,13)}
      if(!rm&&auto&&!S.drawer)tTheta+=dt*.06;if(!auto&&performance.now()-lastUser>9000&&!rm)auto=true;
      const fr=focusId&&!rm?.55:1;
      theta+=(tTheta-theta)*.07;phi+=(tPhi-phi)*.07;radius+=(tRadius*fr-radius)*.06;
    }
    if(focusId&&nodes[focusId]){focusV.copy(nodes[focusId].g.position).multiplyScalar(.7).add(v.copy(homeTarget).multiplyScalar(.3))}else focusV.copy(homeTarget);
    target.lerp(focusV,rm?1:.06);
    par.x+=(parT.x-par.x)*.05;par.y+=(parT.y-par.y)*.05;const px=rm?0:par.x*.16,py=rm?0:par.y*.06;
    cam.position.set(target.x+radius*Math.sin(phi+py)*Math.sin(theta+px),target.y+radius*Math.cos(phi+py),target.z+radius*Math.sin(phi+py)*Math.cos(theta+px));cam.lookAt(target);
    const wantX=S.drawer&&W>760?Math.min(240,W*.17):0;offX+=(wantX-offX)*.08;cam.setViewOffset(W,Hh,offX,shiftY,W,Hh);cam.updateProjectionMatrix();
    // mode easing
    const mt=modeTargets();const k=rm?1:.08;ghost+=(mt.g-ghost)*k;lift+=(mt.l-lift)*k;front+=(mt.f-front)*k;arcK+=(mt.a-arcK)*k;domeK+=(mt.d-domeK)*k;
    mats.forEach(m=>{const g=m.userData.glass?ghost*.75:ghost*.86;m.opacity=m.userData.base*(1-g);m.depthWrite=!m.userData.glass&&ghost<.05});
    // build-up + roof lift, mirrored into the reflection
    kids.forEach((c,i)=>{const p=c.userData.p0;const bt=introDur?(el-.35-c.userData.delay)/.75:1;const drop=(1-easeB(bt))*7;
      const ly=c===roofA?lift*1.9:c===roofB?lift*2.1:0,lz=(c===roofA||c===roofB)?-lift*2.2:0;
      c.position.set(p.x,p.y+drop+ly,p.z+lz);c.visible=bt>-.05;const r=rkids[i];r.position.copy(c.position);r.visible=c.visible});
    frontA.visible=frontB.visible=rFrontA.visible=rFrontB.visible=front>.02&&frontA.visible!==false&&kids[kids.indexOf(frontA)].visible;
    [[frontA,rFrontA],[frontB,rFrontB]].forEach(([f,rf])=>f.children.forEach((o,i)=>{o.scale.y=Math.max(.02,front);rf.children[i].scale.y=o.scale.y}));
    // dome + shockwaves
    const pa=now-protectAt;const pk=pa<3?Math.sin(Math.min(1,pa/.4)*Math.PI/2)*(1-Math.max(0,(pa-1.2)/1.8)):0;
    const dop=Math.max(domeK*1.2,pk)*(offline()?.3:1);domeU.uOpacity.value=dop;domeU.uTime.value=tt;domeRing.material.opacity=dop*.7;dome.visible=dop>.005;
    dome.scale.setScalar(.9+.1*ease(pa/.6));
    for(let i=waves.length-1;i>=0;i--){const w=waves[i];const age=now-w.t0;const s=1+age*w.max/1.6;w.m.scale.setScalar(s);w.m.material.opacity=Math.max(0,.9*(1-age/1.6));if(age>1.6){world.remove(w.m);w.m.geometry.dispose();w.m.material.dispose();waves.splice(i,1)}}
    // nodes
    Object.values(nodes).forEach(n=>{
      n.ping.quaternion.copy(cam.quaternion);if(n.isNet){n.core.rotation.y=tt*.3;n.core.rotation.x=tt*.17}
      const urgent=n.tone==='red'||n.tone==='amber';
      if(urgent&&!rm&&!intro){const p=((tt+n.phase)%1.6)/1.6;n.ping.scale.setScalar(1+p*3.4);n.ping.material.opacity=(1-p)*.85}else n.ping.material.opacity=0;
      n.halo.scale.setScalar((n.isNet?3:1)*(n.focus?1.6:1)*(1+(rm?0:.1*Math.sin(tt*2.2+n.phase))));
      n.halo.material.opacity=(n.rel?.9:.25)*(S.mode==='exterior'?.55:1)*(intro?Math.max(0,(el-introDur+.6)/.6):1);
      n.core.visible=!intro||el>introDur-.4;
      if(n.cage.visible){n.cage.rotation.y=tt*1.4;n.cage.rotation.z=tt*.6}
    });
    // connection lines
    const pt=pulseAt>0?now-pulseAt:99;const showArcs=!intro||el>introDur-.2;arcGroup.visible=showArcs;
    arcs.forEach(a=>{
      const st=a.c.status,f=arcK*(a.rel?1:.12);a.u.uOpacity.value=f;a.u.uTime.value=tt;
      if(st==='allowed'){const sp=.24+(pt<3&&['c3','c4','c1'].includes(a.c.id)?.7:0);const h=rm||a.still?-1:(tt*sp+a.off)%1;a.u.uHead.value=h;a.u.uHead2.value=h<0?-1:(h+.5)%1}
      else if(st==='blocked'){
        const u1=rm||a.still?.0:((tt*.3+a.off)%1),u2=rm||a.still?0:((tt*.3+a.off+.5)%1);
        a.u.uHead.value=rm?-1:u1*.5;a.u.uHead2.value=rm?-1:u2*.5;
        a.shield.quaternion.copy(cam.quaternion);
        const fl=rm?0:Math.max(0,(Math.max(u1,u2)-.88)/.12),bu=rm?1:Math.min(u1<.15?u1/.15:1,u2<.15?u2/.15:1);
        a.flash.material.opacity=fl*.8*f;a.hex.material.opacity=.95*f;a.fillm.material.opacity=(.16+fl*.3)*f;
        a.shield.scale.setScalar(1+fl*.25);a.burst.scale.setScalar(1+bu*2.2);a.burst.material.opacity=(1-bu)*.85*f;
      }
    });
    const lp=pt<4?Math.max(0,Math.sin(Math.min(1,(pt-.9)/.5)*Math.PI/2))*(1-Math.max(0,(pt-3))):0;
    livingL.intensity=offline()?.6:1.5+.9*night+lp*3;bulbCone.visible=!intro;bulbCone.material.opacity=offline()?.01:.05+.06*night+lp*.18;
    // labels
    labelsEl.querySelectorAll('.nl').forEach(el2=>{const n=nodes[el2.dataset.nid];n.g.getWorldPosition(v);v.y+=n.isNet?1.1:.38;v.project(cam);
      const x=(v.x*.5+.5)*W,y=(-v.y*.5+.5)*Hh;el2.style.transform=`translate(${x}px,${y}px) translate(-50%,-100%)`;el2.style.visibility=v.z<1&&!intro?'visible':'hidden'});
    if(composer)composer.render();else R.render(scene,cam);
  }
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&active){prev=performance.now()/1000;loop()}});
  loop();
  return api;
})();

render();
setTimeout(()=>{S.loading=false;render()},1100);
})();
